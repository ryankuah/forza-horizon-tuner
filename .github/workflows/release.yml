name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            name="Forza Horizon Tuner ${tag}"
            prerelease="false"
          else
            tag="v${version}-build.${GITHUB_RUN_NUMBER}.${short_sha}"
            name="Forza Horizon Tuner ${tag}"
            prerelease="true"
          fi

          {
            echo "tag=${tag}"
            echo "name=${name}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate macOS signing secrets
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          missing=()
          for name in MAC_CERTIFICATE MAC_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required macOS signing/notarization secrets: ${missing[*]}"
            echo "Release artifacts are not created because unsigned macOS downloads are blocked by Gatekeeper."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          args=(
            "${RELEASE_TAG}"
            --target "${GITHUB_SHA}"
            --title "${RELEASE_NAME}"
            --notes "Automated build from ${GITHUB_SHA}."
          )

          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          gh release create "${args[@]}"

  build:
    name: Build ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Windows
            os: windows-latest
            target: --win
          - name: Linux
            os: ubuntu-latest
            target: --linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build desktop artifacts
        run: npm run dist:ci -- ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.name == 'macOS' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Align updater asset names
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const releaseDir = path.resolve("release");
          const metadataFiles = ["latest.yml", "latest-mac.yml", "latest-linux.yml"]
            .map((file) => path.join(releaseDir, file))
            .filter((file) => fs.existsSync(file));

          function candidateNames(name) {
            const names = new Set();
            names.add(name);
            names.add(name.replace(/^Forza-Horizon-Tuner-Setup-/, "Forza.Horizon.Tuner.Setup."));
            names.add(name.replace(/^Forza-Horizon-Tuner-/, "Forza.Horizon.Tuner-"));
            return [...names];
          }

          function ensureAssetName(expectedName) {
            const expectedPath = path.join(releaseDir, expectedName);
            if (fs.existsSync(expectedPath)) return;

            const actualName = candidateNames(expectedName).find((name) => fs.existsSync(path.join(releaseDir, name)));
            if (!actualName) {
              throw new Error(`Updater metadata references missing asset: ${expectedName}`);
            }

            fs.renameSync(path.join(releaseDir, actualName), expectedPath);
            console.log(`Renamed ${actualName} -> ${expectedName}`);
          }

          for (const metadataFile of metadataFiles) {
            const metadata = fs.readFileSync(metadataFile, "utf8");
            const referencedNames = [...metadata.matchAll(/^\s*(?:url|path):\s+(.+?)\s*$/gm)]
              .map((match) => match[1].trim().replace(/^['"]|['"]$/g, ""));

            for (const referencedName of referencedNames) {
              ensureAssetName(referencedName);
              const blockmapName = `${referencedName}.blockmap`;
              if (candidateNames(blockmapName).some((name) => fs.existsSync(path.join(releaseDir, name)))) {
                ensureAssetName(blockmapName);
              }
            }
          }
          NODE

      - name: Upload artifacts to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          PLATFORM_NAME: ${{ matrix.name }}
        shell: bash
        run: |
          files=()
          collect_files() {
            while IFS= read -r -d '' file; do
              files+=("${file}")
            done
          }

          case "${PLATFORM_NAME}" in
            macOS)
              collect_files < <(find release -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.yml" -o -name "*.blockmap" \) -print0)
              ;;
            Windows)
              collect_files < <(find release -maxdepth 1 -type f \( -name "*.exe" -o -name "*.yml" -o -name "*.blockmap" \) -print0)
              ;;
            Linux)
              collect_files < <(find release -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.yml" -o -name "*.blockmap" \) -print0)
              ;;
            *)
              echo "Unknown platform: ${PLATFORM_NAME}"
              exit 1
              ;;
          esac

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts found in release/."
            exit 1
          fi

          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
